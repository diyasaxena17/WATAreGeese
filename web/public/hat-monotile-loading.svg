    <path id="hat" d="M 0 0 l 0 -20.7846097 -12 0 -6 -10.3923048 -18 10.3923048 0 20.7846097 -12 0 -6 10.3923048 18 10.3923048 18 -10.3923048 6 10.3923048 24 0 6 -10.3923048 z"/>
  </defs>
